[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-toolkit"
version = "0.1.0"
description = "Shared library for NIDS continual test-time adaptation (CTTA) experiments, including the AGSA (Activation-Gated Spline Adaptation) technique."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "braim" }]
keywords = ["nids", "intrusion-detection", "test-time-adaptation", "ctta", "kan", "agsa"]

# NOTE: efficient-kan is a git-only dependency (not on PyPI). Declaring it as a
# direct reference here makes `pip install git+https://github.com/braim/nids-toolkit.git`
# pull it automatically. This same direct reference is what prevents a clean
# `pip install nids-toolkit` from a PyPI index (PyPI rejects direct-URL deps),
# so a true PyPI publish requires vendoring/publishing the KAN layer first.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=1.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "kagglehub>=0.3",
    "torch>=2.0",
    "efficient-kan @ git+https://github.com/Blealtan/efficient-kan.git",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/braim/nids-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
